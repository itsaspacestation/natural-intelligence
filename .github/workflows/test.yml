name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No shell key: each runner uses its default shell (bash, pwsh, zsh), which proves the plugin is shell-neutral.
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
      - run: bash tests/docs.test.sh
        if: runner.os == 'Linux'
